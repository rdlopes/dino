  <style>
    :root {
      --background-color: #fff;
      --text-color: #535353;
      --google-blue-300: #8ab4f8;
      --google-gray-50: #f8f9fa;
      --google-gray-900: #202124;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background-color: #202124;
        --text-color: #9aa0a6;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--background-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .interstitial-wrapper {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      box-sizing: border-box;
      padding: 0 16px;
    }

    .runner-container {
      direction: ltr;
      height: 150px;
      max-width: 600px;
      width: 100%;
      overflow: hidden;
      position: relative;
      margin: 0 auto;
    }

    .runner-container:focus {
      outline: none;
    }

    .runner-canvas {
      height: 150px;
      max-width: 600px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .controller {
      height: 100vh;
      left: 0;
      position: absolute;
      top: 0;
      width: 100vw;
      z-index: 9;
    }

    #offline-resources {
      display: none;
    }

    .offline-runner-live-region {
      bottom: 0;
      clip-path: polygon(0 0, 0 0, 0 0);
      color: var(--background-color);
      display: block;
      font-size: xx-small;
      overflow: hidden;
      position: absolute;
      text-align: center;
      user-select: none;
    }

    .hidden, .slow-speed-option {
      display: none !important;
    }

    /* Day / Night mode invert transitions */
    .offline {
      transition: filter 1.5s cubic-bezier(0.65, 0.05, 0.36, 1),
      background-color 1.5s cubic-bezier(0.65, 0.05, 0.36, 1);
    }

    .offline.inverted {
      background-color: #fff;
      filter: invert(1);
    }

    .offline.inverted body {
      background-color: #fff;
    }

    @media (prefers-color-scheme: dark) {
      .offline .runner-canvas {
        filter: invert(1);
      }

      .offline.inverted {
        background-color: var(--background-color);
        filter: invert(0);
      }

      .offline.inverted body {
        background-color: #fff;
      }
    }

          const firstObstacle = this.horizon.obstacles[0];
          let collision = hasObstacles && firstObstacle && this.checkForCollision(firstObstacle, this.tRex);
          if (this.hasAudioCuesInternal && hasObstacles) {
            assert(firstObstacle);
            const jumpObstacle = firstObstacle.typeConfig.type !== "collectable";
            if (!firstObstacle.jumpAlerted) {
              const threshold = this.config.audiocueProximityThreshold;
              const adjProximityThreshold = threshold + threshold * Math.log10(this.currentSpeed / this.config.speed);
              if (firstObstacle.xPos < adjProximityThreshold) {
                if (jumpObstacle) {
                  this.getGeneratedSoundFx().jump()
                }
                firstObstacle.jumpAlerted = true

            }

          if (this.isAltGameModeEnabled() && collision && firstObstacle && firstObstacle.typeConfig.type === "collectable") {
            this.horizon.removeFirstObstacle();
            this.tRex.setFlashing(true);
            collision = false;
            this.altGameModeFlashTimer = this.config.flashDuration;
            this.runningTime = 0;
            if (this.hasAudioCuesInternal) {
              this.getGeneratedSoundFx().collect()

          if (!collision) {

            if (this.currentSpeed < this.config.maxSpeed) {

            }

          const playAchievementSound = this.distanceMeter.update(deltaTime, Math.ceil(this.distanceRan));
          if (!this.hasAudioCuesInternal && playAchievementSound) {

          if (!this.isAltGameModeEnabled()) {
            if (this.invertTimer > this.config.invertFadeDuration) {

              this.invertTrigger = false;
              this.invert(false)
            } else if (this.invertTimer) {

            } else {

              if (actualDistance > 0) {
                this.invertTrigger = !(actualDistance % this.config.invertDistance);
                if (this.invertTrigger && this.invertTimer === 0) {
                  this.invertTimer += deltaTime;
                  this.invert(false)

              }

          case RunnerEvents.KEYUP:
          case RunnerEvents.TOUCHEND:

            break;

      }

        }
      }

            assert(this.tRex);

          }

          }
        }
      }

        }
      }

        } else {
          this.slowSpeedCheckbox.removeAttribute("disabled")
        }
      }

      startListening() {
        assert(this.containerEl);
        assert(this.canvas);
        this.containerEl.addEventListener(RunnerEvents.KEYDOWN, this.handleCanvasKeyPress.bind(this));
        if (!IS_MOBILE) {
          this.containerEl.addEventListener(RunnerEvents.FOCUS, this.showSpeedToggle.bind(this))
        }
        this.canvas.addEventListener(RunnerEvents.KEYDOWN, this.preventScrolling.bind(this));
        this.canvas.addEventListener(RunnerEvents.KEYUP, this.preventScrolling.bind(this));
        document.addEventListener(RunnerEvents.KEYDOWN, this);
        document.addEventListener(RunnerEvents.KEYUP, this);
        this.containerEl.addEventListener(RunnerEvents.TOUCHSTART, this);
        document.addEventListener(RunnerEvents.POINTERDOWN, this);
        document.addEventListener(RunnerEvents.POINTERUP, this);
        if (this.isArcadeMode()) {
          window.addEventListener(RunnerEvents.GAMEPADCONNECTED, this)
        }
      }

      onKeyDown(e) {
        if (IS_MOBILE && this.playing) {
          e.preventDefault()
        }
        if (this.isCanvasInView()) {
          if (e instanceof KeyboardEvent && runnerKeycodes.jump.includes(e.keyCode) && e.target === this.slowSpeedCheckbox) {
            return
          }
          if (!this.crashed && !this.paused) {
            const isMobileMouseInput = IS_MOBILE && e instanceof PointerEvent && e.type === RunnerEvents.POINTERDOWN && e.pointerType === "mouse" && (e.target === this.containerEl || IS_IOS && (e.target === this.touchController || e.target === this.canvas));
            assert(this.tRex);
            if (e instanceof KeyboardEvent && runnerKeycodes.jump.includes(e.keyCode) || e.type === RunnerEvents.TOUCHSTART || isMobileMouseInput) {
              e.preventDefault();
              if (!this.playing) {
                if (!this.touchController && e.type === RunnerEvents.TOUCHSTART) {
                  this.createTouchController()
                }
                if (isMobileMouseInput) {
                  this.handleCanvasKeyPress(e)
                }
                this.loadSounds();
                this.setPlayStatus(true);
                this.startGame();
                this.activated = true;
                this.time = getTimeStamp();
                this.update();
                if (window.errorPageController) {
                  window.errorPageController.trackEasterEgg()
                }
              }
              if (!this.tRex.jumping && !this.tRex.ducking) {
                if (this.hasAudioCuesInternal) {
                  this.getGeneratedSoundFx().cancelFootSteps()
                } else {
                  this.playSound(this.soundFx.BUTTON_PRESS)
                }
                this.tRex.startJump(this.currentSpeed)
              }
            } else if (this.playing && e instanceof KeyboardEvent && runnerKeycodes.duck.includes(e.keyCode)) {
              e.preventDefault();
              if (this.tRex.jumping) {
                this.tRex.setSpeedDrop()
              } else if (!this.tRex.jumping && !this.tRex.ducking) {
                this.tRex.setDuck(true)
              }
            }
          }
        }
      }

      onKeyUp(e) {
        assert(this.tRex);
        const keyCode = "keyCode" in e ? e.keyCode : 0;
        const isjumpKey = runnerKeycodes.jump.includes(keyCode) || e.type === RunnerEvents.TOUCHEND || e.type === RunnerEvents.POINTERUP;
        if (this.isRunning() && isjumpKey) {
          this.tRex.endJump()
        } else if (runnerKeycodes.duck.includes(keyCode)) {
          this.tRex.speedDrop = false;
          this.tRex.setDuck(false)
        } else if (this.crashed) {
          const deltaTime = getTimeStamp() - this.time;
          if (this.isCanvasInView() && (runnerKeycodes.restart.includes(keyCode) || this.isLeftClickOnCanvas(e) || deltaTime >= this.config.gameoverClearTime && runnerKeycodes.jump.includes(keyCode))) {
            this.handleGameOverClicks(e)
          }
        } else if (this.paused && isjumpKey) {
          this.tRex.reset();
          this.play()
        }
      }

      onGamepadConnected() {
        if (!this.pollingGamepads) {
          this.pollGamepadState()
        }
      }

      pollGamepadState() {
        const gamepads = navigator.getGamepads();
        this.pollActiveGamepad(gamepads);
        this.pollingGamepads = true;
        requestAnimationFrame(this.pollGamepadState.bind(this))
      }

      pollForActiveGamepad(gamepads) {
        for (const [i, gamepad] of gamepads.entries()) {
          if (gamepad && gamepad.buttons.length > 0 && gamepad.buttons[0].pressed) {
            this.gamepadIndex = i;
            this.pollActiveGamepad(gamepads);
            return
          }
        }
      }

      pollActiveGamepad(gamepads) {
        if (this.gamepadIndex === undefined) {
          this.pollForActiveGamepad(gamepads);
          return
        }
        const gamepad = gamepads[this.gamepadIndex];
        if (!gamepad) {
          this.gamepadIndex = undefined;
          this.pollForActiveGamepad(gamepads);
          return
        }
        this.pollGamepadButton(gamepad, 0, 38);
        if (gamepad.buttons.length >= 2) {
          this.pollGamepadButton(gamepad, 1, 40)
        }
        if (gamepad.buttons.length >= 10) {
          this.pollGamepadButton(gamepad, 9, 13)
        }
        this.previousGamepad = gamepad
      }

      pollGamepadButton(gamepad, buttonIndex, keyCode) {
        const state = gamepad.buttons[buttonIndex]?.pressed || false;
        let previousState = false;
        if (this.previousGamepad) {
          previousState = this.previousGamepad.buttons[buttonIndex]?.pressed || false
        }
        if (state !== previousState) {
          const e = new KeyboardEvent(state ? RunnerEvents.KEYDOWN : RunnerEvents.KEYUP, {keyCode: keyCode});
          document.dispatchEvent(e)
        }
      }

      handleGameOverClicks(e) {
        if (e.target !== this.slowSpeedCheckbox) {
          assert(this.distanceMeter);
          e.preventDefault();
          if (this.distanceMeter.hasClickedOnHighScore(e) && this.highestScore) {
            if (this.distanceMeter.isHighScoreFlashing()) {
              this.saveHighScore(0, true);
              this.distanceMeter.resetHighScore()
            } else {
              this.distanceMeter.startHighScoreFlashing()
            }
          } else {
            this.distanceMeter.cancelHighScoreFlashing();
            this.restart()
          }
        }
      }

      isLeftClickOnCanvas(e) {
        if (!(e instanceof MouseEvent)) {
          return false
        }
        return e.button != null && e.button < 2 && e.type === RunnerEvents.POINTERUP && (e.target === this.canvas || IS_MOBILE && this.hasAudioCuesInternal && e.target === this.containerEl)
      }

      scheduleNextUpdate() {
        if (!this.updatePending) {
          this.updatePending = true;
          this.raqId = requestAnimationFrame(this.update.bind(this))
        }
      }

      isRunning() {
        return !!this.raqId
      }

      initializeHighScore(highScore) {
        assert(this.distanceMeter);
        this.syncHighestScore = true;
        highScore = Math.ceil(highScore);
        if (highScore < this.highestScore) {
          if (window.errorPageController) {
            window.errorPageController.updateEasterEggHighScore(this.highestScore)
          }
          return
        }
        this.highestScore = highScore;
        this.distanceMeter.setHighScore(this.highestScore)
      }

      saveHighScore(distanceRan, resetScore) {
        assert(this.distanceMeter);
        this.highestScore = Math.ceil(distanceRan);
        this.distanceMeter.setHighScore(this.highestScore);
        try {
          localStorage.setItem("dino-high-score", this.highestScore);
        } catch (e) {
        }
        if (this.syncHighestScore && window.errorPageController) {
          if (resetScore) {
            window.errorPageController.resetEasterEggHighScore()
          } else {
            window.errorPageController.updateEasterEggHighScore(this.highestScore)
          }
        }
      }

      gameOver() {
        assert(this.distanceMeter);
        assert(this.tRex);
        assert(this.containerEl);
        this.playSound(this.soundFx.HIT);
        vibrate(200);
        this.stop();
        this.crashed = true;
        this.distanceMeter.achievement = false;
        this.tRex.update(100, Status.CRASHED);
        if (!this.gameOverPanel) {
          const origSpriteDef = IS_HIDPI ? spriteDefinitionByType.original.hdpi : spriteDefinitionByType.original.ldpi;
          if (this.canvas) {
            if (this.isAltGameModeEnabled()) {
              this.gameOverPanel = new GameOverPanel(this.canvas, origSpriteDef.textSprite, origSpriteDef.restart, this.dimensions, this, origSpriteDef.altGameEnd, this.altGameModeActive)
            } else {
              this.gameOverPanel = new GameOverPanel(this.canvas, origSpriteDef.textSprite, origSpriteDef.restart, this.dimensions, this)
            }
          }
        }
        assert(this.gameOverPanel);
        this.gameOverPanel.draw(this.altGameModeActive, this.tRex);
        if (this.distanceRan > this.highestScore) {
          this.saveHighScore(this.distanceRan)
        }
        this.time = getTimeStamp();
        if (this.hasAudioCuesInternal) {
          this.getGeneratedSoundFx().stopAll();
          assert(this.containerEl);
          this.announcePhrase(getA11yString(A11yStrings.GAME_OVER).replace("$1", this.distanceMeter.getActualDistance(this.distanceRan).toString()) + " " + getA11yString(A11yStrings.HIGH_SCORE).replace("$1", this.distanceMeter.getActualDistance(this.highestScore).toString()));
          this.containerEl.setAttribute("title", getA11yString(A11yStrings.ARIA_LABEL))
        }
        this.showSpeedToggle();
        this.disableSpeedToggle(false)
      }

      stop() {
        this.setPlayStatus(false);
        this.paused = true;
        cancelAnimationFrame(this.raqId);
        this.raqId = 0;
        if (this.hasAudioCuesInternal) {
          this.getGeneratedSoundFx().stopAll()
        }
      }

      play() {
        if (!this.crashed) {
          assert(this.tRex);
          this.setPlayStatus(true);
          this.paused = false;
          this.tRex.update(0, Status.RUNNING);
          this.time = getTimeStamp();
          this.update();
          if (this.hasAudioCuesInternal) {
            this.getGeneratedSoundFx().background()
          }
        }
      }

      restart() {
        if (!this.raqId) {
          assert(this.containerEl);
          assert(this.gameOverPanel);
          assert(this.tRex);
          assert(this.horizon);
          assert(this.distanceMeter);
          this.playCount++;
          this.runningTime = 0;
          this.setPlayStatus(true);
          this.toggleSpeed();
          this.paused = false;
          this.crashed = false;
          this.distanceRan = 0;
          this.setSpeed(this.config.speed);
          this.time = getTimeStamp();
          this.containerEl.classList.remove(RunnerClasses.CRASHED);
          this.clearCanvas();
          this.distanceMeter.reset();
          this.horizon.reset();
          this.tRex.reset();
          this.playSound(this.soundFx.BUTTON_PRESS);
          this.invert(true);
          this.update();
          this.gameOverPanel.reset();
          if (this.hasAudioCuesInternal) {
            this.getGeneratedSoundFx().background()
          }
          this.containerEl.setAttribute("title", getA11yString(A11yStrings.JUMP));
          this.announcePhrase(getA11yString(A11yStrings.STARTED))
        }
      }

      setPlayStatus(isPlaying) {
        if (this.touchController) {
          this.touchController.classList.toggle(HIDDEN_CLASS, !isPlaying)
        }
        this.playing = isPlaying
      }

      isArcadeMode() {
        return document.title.startsWith(ARCADE_MODE_URL, IS_RTL ? 1 : 0)
      }

      setArcadeMode() {
        document.body.classList.add(RunnerClasses.ARCADE_MODE);
        this.setArcadeModeContainerScale()
      }

      setArcadeModeContainerScale() {
        assert(this.containerEl);
        const windowHeight = window.innerHeight;
        const scaleHeight = windowHeight / this.dimensions.height;
        const scaleWidth = window.innerWidth / this.dimensions.width;
        const scale = Math.max(1, Math.min(scaleHeight, scaleWidth));
        const scaledCanvasHeight = this.dimensions.height * scale;
        const translateY = Math.ceil(Math.max(0, (windowHeight - scaledCanvasHeight - this.config.arcadeModeInitialTopPosition) * this.config.arcadeModeTopPositionPercent)) * window.devicePixelRatio;
        const cssScale = IS_RTL ? -scale + "," + scale : scale;
        this.containerEl.style.transform = "scale(" + cssScale + ") translateY(" + translateY + "px)"
      }

      onVisibilityChange(e) {
        if (document.hidden || e.type === "blur" || document.visibilityState !== "visible") {
          this.stop()
        } else if (!this.crashed) {
          assert(this.tRex);
          this.tRex.reset();
          this.play()
        }
      }

      playSound(soundBuffer) {
        if (soundBuffer) {
          assert(this.audioContext);
          const sourceNode = this.audioContext.createBufferSource();
          sourceNode.buffer = soundBuffer;
          sourceNode.connect(this.audioContext.destination);
          sourceNode.start(0)
        }
      }

      invert(reset) {
        const htmlEl = document.firstElementChild;
        assert(htmlEl);
        if (reset) {
          htmlEl.classList.toggle(RunnerClasses.INVERTED, false);
          this.invertTimer = 0;
          this.inverted = false
        } else {
          this.inverted = htmlEl.classList.toggle(RunnerClasses.INVERTED, this.invertTrigger)
        }
      }

      announcePhrase(phrase) {
        if (this.a11yStatusEl) {
          this.a11yStatusEl.textContent = "";
          this.a11yStatusEl.textContent = phrase
        }
      }

      checkForCollision(obstacle, tRex, canvasCtx) {
        const tRexBox = new CollisionBox(tRex.xPos + 1, tRex.yPos + 1, tRex.config.width - 2, tRex.config.height - 2);
        const obstacleBox = new CollisionBox(obstacle.xPos + 1, obstacle.yPos + 1, obstacle.typeConfig.width * obstacle.size - 2, obstacle.typeConfig.height - 2);
        if (canvasCtx) {
          drawCollisionBoxes(canvasCtx, tRexBox, obstacleBox)
        }
        if (boxCompare(tRexBox, obstacleBox)) {
          const collisionBoxes = obstacle.collisionBoxes;
          let tRexCollisionBoxes = [];
          if (this.isAltGameModeEnabled()) {
            const runnerSpriteDefinition = this.getSpriteDefinition();
            assert(runnerSpriteDefinition);
            assert(runnerSpriteDefinition.tRex);
            tRexCollisionBoxes = runnerSpriteDefinition.tRex.collisionBoxes
          } else {
            tRexCollisionBoxes = tRex.getCollisionBoxes()
          }
          for (const tRexCollisionBox of tRexCollisionBoxes) {
            for (const obstacleCollixionBox of collisionBoxes) {
              const adjTrexBox = createAdjustedCollisionBox(tRexCollisionBox, tRexBox);
              const adjObstacleBox = createAdjustedCollisionBox(obstacleCollixionBox, obstacleBox);
              const crashed = boxCompare(adjTrexBox, adjObstacleBox);
              if (canvasCtx) {
                drawCollisionBoxes(canvasCtx, adjTrexBox, adjObstacleBox)
              }
              if (crashed) {
                return [adjTrexBox, adjObstacleBox]
              }
            }
          }
        }
        return null
      }
    }

    function updateCanvasScaling(canvas, width, height) {
      const context = canvas.getContext("2d");
      assert(context);
      const devicePixelRatio = Math.floor(window.devicePixelRatio) || 1;
      const backingStoreRatio = "webkitBackingStorePixelRatio" in context ? Math.floor(context.webkitBackingStorePixelRatio) : 1;
      const ratio = devicePixelRatio / backingStoreRatio;
      if (devicePixelRatio !== backingStoreRatio) {
        const oldWidth = canvas.width;
        const oldHeight = canvas.height;
        canvas.width = oldWidth * ratio;
        canvas.height = oldHeight * ratio;
        canvas.style.width = oldWidth + "px";
        canvas.style.height = oldHeight + "px";
        context.scale(ratio, ratio);
        return true
      } else if (devicePixelRatio === 1) {
        canvas.style.width = canvas.width + "px";
        canvas.style.height = canvas.height + "px"
      }
      return false
    }

    function getA11yString(stringName) {
      return loadTimeData.valueExists(stringName) ? loadTimeData.getString(stringName) : ""
    }

    function vibrate(duration) {
      if (IS_MOBILE && window.navigator.vibrate) {
        window.navigator.vibrate(duration)
      }
    }

    function createCanvas(container, width, height, classname) {
      const canvas = document.createElement("canvas");
      canvas.className = RunnerClasses.CANVAS;
      canvas.width = width;
      canvas.height = height;
      container.appendChild(canvas);
      return canvas
    }

    function decodeBase64ToArrayBuffer(base64String) {
      const len = base64String.length / 4 * 3;
      const str = atob(base64String);
      const arrayBuffer = new ArrayBuffer(len);
      const bytes = new Uint8Array(arrayBuffer);
      for (let i = 0; i < len; i++) {
        bytes[i] = str.charCodeAt(i)
      }
      return bytes.buffer
    }

    function createAdjustedCollisionBox(box, adjustment) {
      return new CollisionBox(box.x + adjustment.x, box.y + adjustment.y, box.width, box.height)
    }

    function drawCollisionBoxes(canvasCtx, tRexBox, obstacleBox) {
      canvasCtx.save();
      canvasCtx.strokeStyle = "#f00";
      canvasCtx.strokeRect(tRexBox.x, tRexBox.y, tRexBox.width, tRexBox.height);
      canvasCtx.strokeStyle = "#0f0";
      canvasCtx.strokeRect(obstacleBox.x, obstacleBox.y, obstacleBox.width, obstacleBox.height);
      canvasCtx.restore()
    }

    function boxCompare(tRexBox, obstacleBox) {
      const tRexBoxX = tRexBox.x;
      const tRexBoxY = tRexBox.y;
      const obstacleBoxX = obstacleBox.x;
      const obstacleBoxY = obstacleBox.y;
      return tRexBoxX < obstacleBoxX + obstacleBox.width && tRexBoxX + tRexBox.width > obstacleBoxX && tRexBoxY < obstacleBoxY + obstacleBox.height && tRexBox.height + tRexBoxY > obstacleBoxY;
    }

    var loadTimeDataRaw = {
      "dinoGameA11yAriaLabel": "Jeu du dino, appuyer sur la barre d'espace pour jouer",
      "dinoGameA11yAriaLabelHybrid": "Jeu du dino, appuyer sur le dinosaure ou sur la barre d'espace pour jouer",
      "dinoGameA11yAriaLabelKeyboard": "Jeu du dino, appuyer sur la barre d'espace pour jouer",
      "dinoGameA11yAriaLabelTouch": "Jeu du dino, appuyer pour jouer",
      "dinoGameA11yDescription": "Jeu du dino. Un dinosaure pixelisé traverse un paysage désolé en esquivant les cactus et les ptérodactyles. Lorsque vous entendez un signal audio, appuyez sur Espace pour le faire sauter par-dessus les obstacles.",
      "dinoGameA11yGameOver": "Partie terminée ! Votre score est de $1.",
      "dinoGameA11yHighScore": "Meilleur score : $1.",
      "dinoGameA11yJump": "Sautez !",
      "dinoGameA11ySpeedToggle": "Vitesse plus lente",
      "dinoGameA11yStartGame": "Le jeu a commencé.",
      "dinoGameInstructionsHybrid": "Appuyez sur le dinosaure ou sur la barre d'espace pour jouer",
      "dinoGameInstructionsKeyboard": "Appuyez sur la barre d'espace pour jouer",
      "dinoGameInstructionsTouch": "Appuyez sur le dinosaure pour jouer",
      "errorCode": "",
      "fontfamily": "system-ui, sans-serif",
      "fontfamilyMd": "system-ui, sans-serif",
      "fontsize": "75%",
      "heading": {"msg": "Appuyez sur la barre d'espace pour jouer"},
      "iconClass": "icon-offline",
      "isOfflineError": true,
      "language": "fr",
      "roundedIconsAttribute": "",
      "textdirection": "ltr",
      "title": "chrome://dino/",
      "webuiRoundedIconsAttribute": "",
      "webuiRoundedIconsEnabled": false
    };
    document.addEventListener("DOMContentLoaded", () => {
      loadTimeData.data = loadTimeDataRaw;
      document.documentElement.classList.add("offline");
      window.Runner = Runner;
      Runner.initializeInstance(".interstitial-wrapper");
    });
  </script>
</head>

  <script>
    (function() {
      function pressSpace() {
        const keyDown = new KeyboardEvent("keydown", {
          keyCode: 32,
          which: 32,
          code: "Space",
          key: " ",
          bubbles: true
        });
        document.dispatchEvent(keyDown);

        setTimeout(() => {
          const keyUp = new KeyboardEvent("keyup", {
            keyCode: 32,
            which: 32,
            code: "Space",
            key: " ",
            bubbles: true
          });
          document.dispatchEvent(keyUp);
        }, 150);
      }

      let isStarting = false;
      let isRestarting = false;

      function autoJump() {
        requestAnimationFrame(autoJump);

        let runner;
        try {
          runner = window.Runner && window.Runner.getInstance ? window.Runner.getInstance() : null;
        } catch (e) {
          return;
        }
        if (!runner || !runner.tRex) return;

        // Automatically start the game if not playing yet
        if (!runner.playing && !runner.crashed) {
          if (!isStarting) {
            isStarting = true;
            setTimeout(() => {
              pressSpace();
              isStarting = false;
            }, 500);
          }
          return;
        }

        // Automatically restart after game over cooldown
        if (runner.crashed) {
          if (!isRestarting) {
            isRestarting = true;
            setTimeout(() => {
              pressSpace();
              isRestarting = false;
            }, 1300);
          }
          return;
        }

        // Wait if the dinosaur is already airborne or ducking
        if (runner.tRex.jumping || runner.tRex.ducking) return;

        // Find the nearest upcoming obstacle ahead of the dinosaur
        const obstacle = runner.horizon && runner.horizon.obstacles.find(obs => {
          // Obstacle must be ahead of the dinosaur
          if (obs.xPos <= runner.tRex.xPos) return false;
          // High-altitude pterodactyls (yPos <= 50) fly safely above the dino
          if (obs.typeConfig.type === "pterodactyl" && obs.yPos <= 50) return false;
          // Ignore collectibles
          return obs.typeConfig.type !== "collectable";
        });

        if (!obstacle) return;

        // Simplest computation to determine when to jump:
        // - distance: horizontal distance from dino to obstacle (pixels)
        // - currentSpeed: distance traveled per frame (pixels/frame)
        // - timeToObstacle: frames until obstacle reaches dinosaur (distance / speed)
        // - JUMP_LEAD_TIME: frames needed for the jump to clear obstacle height (~16 frames)
        const JUMP_LEAD_TIME = 16;
        const distance = obstacle.xPos - runner.tRex.xPos;
        const timeToObstacle = distance / runner.currentSpeed;
        const timeToJump = timeToObstacle - JUMP_LEAD_TIME;

        // Press space when it is time to jump
        if (timeToJump <= 0) {
          pressSpace();
        }
      }

      if (document.readyState === "complete" || document.readyState === "interactive") {
        requestAnimationFrame(autoJump);
      } else {
        window.addEventListener("load", () => requestAnimationFrame(autoJump));
      }
    })();
  </script>
